site_name: VIAUMSMA001 - AI Technologies
site_author: Kvancz Balázs, Domonkos Ádám
copyright: Copyright &copy; BME VIK AUT
repo_name: viaumsma001/laboratories
repo_url: https://github.com/VIAUMSMA001/laboratories
edit_uri: edit/main/docs/
site_url: https://viaumsma001.github.io/laboratories/

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: aut
      primary: aut
      accent: red
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.action.edit
    - toc.follow
    - content.code.copy
  logo: logo-bme-aut.png
  favicon: favicon.ico

extra_css:
  - extra-material-theme.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed
  - pymdownx.tilde
  - pymdownx.keys
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.striphtml:
      strip_comments: true
  - attr_list


plugins:
  - search
  - open-in-new-tab
  - glightbox
  - git-revision-date-localized:
      # override from docker environment variables
      # not a vanilla yaml syntax, only works with mkdocs.yaml because of pyyaml_env_tag
      enabled: !ENV [IsRevisionDatePluginEnabled, false]
      enable_creation_date: false
      type: timeago
      timezone: Europe/Budapest
      locale: hu
  - git-committers:
      # override from docker environment variables
      # not a vanilla yaml syntax, only works with mkdocs.yaml because of pyyaml_env_tag
      enabled: !ENV [IsAuthorsPluginEnabled, false]
      github_token: !ENV [GITHUB_TOKEN, '']
      repository: VIAUMSMA001/laboratories
      branch: main

nav:
  - index.md
  - "Information":
      - information/contributing.md
      - information/github.md
  - "Laboratories":
      - laboratories/01-ai-environments/index.md
      - laboratories/02-nlp/index.md
      - laboratories/03-local-llm-integration/index.md
      - laboratories/04-custom-rag-langchain/index.md
      - laboratories/05-multimodal-pipeline/index.md
      - laboratories/06-model-deployment/index.md
  - "Homework":
      - homework/index.md

